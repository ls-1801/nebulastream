[package]
name = "adaptive-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "adaptive_engine"
crate-type = ["lib", "staticlib"]

[features]
cpp-ffi = ["dep:cxx", "dep:cxx-build"]

[dependencies]
thiserror = "2.0"
crossbeam = "0.8"
rand = "0.8"
cxx = { version = "1.0", optional = true }

[build-dependencies]
cxx-build = { version = "1.0", optional = true }
